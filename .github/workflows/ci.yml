name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            setup.cfg

      - name: Install HoloForge and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Run verification benchmark
        run: holoforge verify soft-wall-vector

  historical-audit:
    name: Extended historical route audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            setup.cfg

      - name: Install HoloForge and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run preserved superseded-route audits once
        run: |
          python -m unittest tests.extended.historical_holographic_superconductor_optical tests.extended.historical_dewolfe_gubser_rosen_emd_finite_density -v

  package:
    name: Build and smoke-test wheel
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            setup.cfg

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install and verify wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "from importlib.metadata import version; import holoforge; assert holoforge.__version__ == version('holoforge')"
          python -c "from holoforge.benchmarks import BUILTIN_BENCHMARKS; assert {'holographic-superconductor-optical', 'dewolfe-gubser-rosen-emd-finite-density'} <= set(BUILTIN_BENCHMARKS.identifiers)"
          python -c "from holoforge.reference_data import load_reference_dataset; assert load_reference_dataset('data/reference/dewolfe-gubser-rosen-figure-5-at-tc.json')['id'] == 'dewolfe-gubser-rosen-figure-5-at-tc'"
          holoforge verify soft-wall-vector

  portability:
    name: Wheel portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            setup.cfg

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install wheel and test dependencies
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pip install "jsonschema>=4.18" "matplotlib>=3.6"
          python -c "from importlib.metadata import version; import holoforge; assert holoforge.__version__ == version('holoforge')"

      - name: Run bounded contract and benchmark tests
        run: |
          python -m unittest tests.test_core_contracts tests.test_benchmark_registry tests.test_cli tests.test_schemas tests.test_reference_loader tests.test_evidence tests.test_evidence_schemas tests.test_linear_axion_dc tests.test_hard_wall_chiral -v
          holoforge verify linear-axion-dc
          holoforge verify hard-wall-chiral

      - name: Relocate and audit an evidence bundle
        run: |
          holoforge verify soft-wall-vector --grid-points 600 --bundle-dir portability-bundle
          python -c "from pathlib import Path; target = Path('relocated'); target.mkdir(); Path('portability-bundle').rename(target / 'portability-bundle')"
          holoforge audit bundle relocated/portability-bundle
